[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.136.1",
    "pandas>=3.0.3,<3.1.0",
    "websockets>=16.0,<17.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<4.7.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.13,<0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app", "simulator"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
